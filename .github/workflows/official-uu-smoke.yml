name: Official UU download smoke

on:
  push:
    branches:
      - 'impl/**'
    paths:
      - '.github/workflows/official-uu-smoke.yml'
      - 'scripts/official-uu-smoke.ps1'
      - 'scripts/inspect-official-uu.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-official-download:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Discover and verify official Windows installer
        id: probe
        shell: pwsh
        run: ./scripts/official-uu-smoke.ps1
      - name: Inspect verified package and embedded CLI
        shell: pwsh
        run: ./scripts/inspect-official-uu.ps1
      - name: Summary
        if: always()
        shell: pwsh
        env:
          INSTALLER_URL: ${{ steps.probe.outputs.installer_url }}
          UU_VERSION: ${{ steps.probe.outputs.version }}
          UU_PRODUCT: ${{ steps.probe.outputs.product }}
          UU_SIGNER: ${{ steps.probe.outputs.signer }}
          UU_SHA256: ${{ steps.probe.outputs.sha256 }}
        run: |
          "## Official UU smoke" >> $env:GITHUB_STEP_SUMMARY
          "- Source page: https://uuyc.163.com/download/" >> $env:GITHUB_STEP_SUMMARY
          "- Installer URL: $env:INSTALLER_URL" >> $env:GITHUB_STEP_SUMMARY
          "- Version: $env:UU_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "- Product: $env:UU_PRODUCT" >> $env:GITHUB_STEP_SUMMARY
          "- Signer: $env:UU_SIGNER" >> $env:GITHUB_STEP_SUMMARY
          "- SHA256: $env:UU_SHA256" >> $env:GITHUB_STEP_SUMMARY
