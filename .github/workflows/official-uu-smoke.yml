name: Official UU download smoke

on:
  push:
    branches:
      - 'impl/**'
    paths:
      - '.github/workflows/official-uu-smoke.yml'
      - 'scripts/official-uu-smoke.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-official-download:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Discover and verify official Windows installer
        id: probe
        shell: pwsh
        run: ./scripts/official-uu-smoke.ps1
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "## Official UU smoke" >> $env:GITHUB_STEP_SUMMARY
          "- Source page: https://uuyc.163.com/download/" >> $env:GITHUB_STEP_SUMMARY
          "- Installer URL: ${{ steps.probe.outputs.installer_url }}" >> $env:GITHUB_STEP_SUMMARY
          "- Version: ${{ steps.probe.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
          "- SHA256: ${{ steps.probe.outputs.sha256 }}" >> $env:GITHUB_STEP_SUMMARY
