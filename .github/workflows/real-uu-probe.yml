name: Build real UU observation probe
on:
  push:
    branches: [experiment/real-uu-probe]
    paths: ['experiments/real-uu-probe/**', '.github/workflows/real-uu-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    env:
      PROBE_BUILD_SHA: ${{ github.sha }}
      PROBE_CANDIDATE_SHA: 3c2e44725b8f80ac09c593482ebcc964190c27c6
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/real-uu-probe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fetch pinned channel modules for candidate validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          $moduleLines = @()
          foreach ($module in @('job', 'runner', 'transport')) {
            $candidatePath = Join-Path (Get-Location) "target/candidate_$module.rs"
            Invoke-WebRequest "https://raw.githubusercontent.com/teddyli18000/uu-cli/$env:PROBE_CANDIDATE_SHA/src/$module.rs" -OutFile $candidatePath
            $moduleLines += '#[allow(dead_code)]'
            $moduleLines += '#[path = r"' + $candidatePath + '"] mod ' + $module + ';'
          }
          $modulePath = Join-Path (Get-Location) 'target/candidate_modules.rs'
          $moduleLines | Set-Content -Encoding utf8 $modulePath
          "CANDIDATE_MODULES_PATH=$modulePath" >> $env:GITHUB_ENV
      - run: cargo fmt --check
      - run: cargo clippy --locked --features candidate -- -D warnings
      - run: cargo build --locked --release --features candidate
      - uses: actions/upload-artifact@v4
        with:
          name: real-uu-probe-windows
          path: experiments/real-uu-probe/target/release/real-uu-probe.exe
          if-no-files-found: error
          retention-days: 7
