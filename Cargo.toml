[package]
name = "uu-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Transparent CLI bridge for NetEase UU Remote terminals"
license = "MIT"

[[bin]]
name = "uu"
path = "src/main.rs"

[[bin]]
name = "uu-background"
path = "src/background.rs"

[[bin]]
name = "fake-uuyc"
path = "tests/fixtures/fake_uuyc.rs"
required-features = ["test-fixture"]

[features]
test-fixture = []

[dependencies]
anyhow = "1.0"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
portable-pty = "0.9"
ctrlc = "3.4"
winreg = "0.55"

[dev-dependencies]
tempfile = "3.13"
