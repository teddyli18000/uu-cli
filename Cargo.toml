[package]
name = "uu-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Transparent CLI bridge for NetEase UU Remote terminals"
license = "MIT"

[[bin]]
name = "uu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
portable-pty = "0.9"
winreg = "0.55"

[dev-dependencies]
tempfile = "3.13"
